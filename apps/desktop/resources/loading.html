<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>PAPYRUS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #111111;
        color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif;
        -webkit-app-region: drag;
      }
      .mark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
      }
      .phase {
        font-size: 13px;
        color: #a1a1aa;
        min-height: 1.2em;
      }
      .bar {
        width: 220px;
        height: 2px;
        background: #2a2a2a;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #d1d5db;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .log {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        font-size: 11px;
        line-height: 1.5;
        color: #71717a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        max-height: 30vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="mark">PAPYRUS</div>
    <div class="bar"><span></span></div>
    <div class="phase" id="phase">서버를 준비하는 중…</div>
    <div class="log" id="log"></div>
    <script>
      const phaseEl = document.getElementById('phase')
      const logEl = document.getElementById('log')
      const lines = []
      if (window.papyrusDesktop?.onLog) {
        window.papyrusDesktop.onLog((line) => {
          lines.push(line)
          logEl.textContent = lines.slice(-6).join('\n')
        })
      }
    </script>
  </body>
</html>
