<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civilization Service Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: #0f1419;
        color: #e4e6eb;
        overflow: hidden;
        height: 100vh;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 20px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 반응형 미디어 쿼리 */
      @media (max-width: 1400px) {
        .container {
          padding: 16px;
          gap: 16px;
        }
      }

      @media (max-width: 1024px) {
        .container {
          padding: 12px;
          gap: 12px;
        }
      }

      /* 헤더 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo {
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
      }

      .status-badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.3);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-badge.loading {
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
        border-color: rgba(59, 130, 246, 0.3);
      }

      .status-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .header-actions {
        display: flex;
        gap: 10px;
      }

      /* 버튼 스타일 */
      .btn {
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
      }

      .btn-primary {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #e4e6eb;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.25);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      /* 메인 그리드 */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }

      /* 반응형: 태블릿 */
      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }
      }

      /* 카드 */
      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(10px);
        overflow: hidden;
      }

      @media (max-width: 1024px) {
        .card {
          padding: 16px;
          border-radius: 12px;
        }
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .card-title {
        font-size: 16px;
        font-weight: 600;
        color: #f3f4f6;
      }

      /* 서비스 목록 */
      .services-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        padding-right: 8px;
      }

      .services-list::-webkit-scrollbar {
        width: 6px;
      }

      .services-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .service-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 16px;
        transition: all 0.2s ease;
      }

      .service-item:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(99, 102, 241, 0.3);
      }

      .service-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .service-icon {
        font-size: 24px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .service-info {
        flex: 1;
      }

      .service-name {
        font-size: 14px;
        font-weight: 600;
        color: #f3f4f6;
        margin-bottom: 2px;
      }

      .service-port {
        font-size: 12px;
        color: #9ca3af;
      }

      .service-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .service-status.running {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }

      .service-status.stopped {
        background: rgba(156, 163, 175, 0.15);
        color: #9ca3af;
      }

      .service-status.loading {
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
      }

      .service-status.error {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }

      .service-status .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }

      .service-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 8px;
        flex: 1;
      }

      .btn-icon {
        padding: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 로그 패널 */
      .log-panel {
        grid-column: 1 / -1;
        min-height: 150px;
        resize: vertical;
        overflow: auto;
      }

      @media (max-width: 1024px) {
        .log-panel {
          min-height: 120px;
        }
      }

      .log-output {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 16px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        line-height: 1.6;
        color: #d1d5db;
        overflow-y: auto;
        height: 100%;
        min-height: 120px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      @media (max-width: 1024px) {
        .log-output {
          font-size: 11px;
          padding: 12px;
          min-height: 100px;
        }
      }

      .log-output::-webkit-scrollbar {
        width: 6px;
      }

      .log-output::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .log-output:empty::before {
        content: '로그가 없습니다. 서버를 시작하면 로그가 표시됩니다.';
        color: #6b7280;
        font-style: italic;
      }

      /* 실시간 콘솔 로그 */
      .console-log-panel {
        grid-column: 1 / -1;
        min-height: 150px;
        resize: vertical;
        overflow: auto;
      }

      .console-output {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 12px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #d1d5db;
        overflow-y: auto;
        height: 100%;
        min-height: 120px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .console-output::-webkit-scrollbar {
        width: 6px;
      }

      .console-output::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .console-output:empty::before {
        content: '실시간 콘솔 로그가 여기에 표시됩니다.';
        color: #6b7280;
        font-style: italic;
      }

      /* 포트 상태 */
      .port-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        overflow-y: auto;
      }

      .port-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
      }

      .port-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .port-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .port-number {
        font-size: 16px;
        font-weight: 600;
        color: #6366f1;
        font-variant-numeric: tabular-nums;
      }

      .port-name {
        font-size: 12px;
        color: #9ca3af;
      }

      .port-status {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
      }

      .port-status.open {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }

      .port-status.closed {
        background: rgba(156, 163, 175, 0.15);
        color: #9ca3af;
      }

      .port-status.checking {
        background: rgba(59, 130, 246, 0.15);
        color: #3b82f6;
      }

      /* 탭 메뉴 */
      .tab-menu {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        background: rgba(0, 0, 0, 0.2);
        padding: 4px;
        border-radius: 10px;
      }

      .tab {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #9ca3af;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .tab.active {
        background: rgba(99, 102, 241, 0.2);
        color: #6366f1;
      }

      .tab:hover:not(.active) {
        background: rgba(255, 255, 255, 0.05);
        color: #e4e6eb;
      }

      /* 로딩 스피너 */
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 헤더 -->
      <div class="header">
        <div class="header-left">
          <div class="logo">🏛️ CIVILIZATION</div>
          <div class="status-badge" id="globalStatus">
            <span class="dot"></span>
            <span id="statusText">초기화 중...</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary" id="startAllBtn" disabled>
            ▶ 모두 시작
          </button>
          <button class="btn btn-danger" id="stopAllBtn" disabled>
            ⏸ 모두 중지
          </button>
        </div>
      </div>

      <!-- 메인 그리드 -->
      <div class="main-grid">
        <!-- 서비스 목록 -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">서비스</h2>
          </div>
          <div class="services-list" id="servicesList"></div>
        </div>

        <!-- 포트 상태 -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">포트 상태</h2>
          </div>
          <div class="port-grid" id="portGrid"></div>
        </div>

        <!-- 로그 패널 -->
        <div class="card log-panel">
          <div class="card-header">
            <h2 class="card-title">서비스 로그</h2>
            <div class="tab-menu" id="logTabs"></div>
          </div>
          <div class="log-output" id="logOutput"></div>
        </div>

        <!-- 실시간 콘솔 로그 -->
        <div class="card console-log-panel">
          <div class="card-header">
            <h2 class="card-title">🖥️ 실시간 콘솔</h2>
            <button class="btn btn-secondary btn-sm" onclick="clearConsoleLog()">
              지우기
            </button>
          </div>
          <div class="console-output" id="consoleOutput"></div>
        </div>
      </div>
    </div>

    <script>
      // 실시간 콘솔 로그 저장
      let consoleLogBuffer = []
      const MAX_CONSOLE_LOGS = 100

      // 콘솔 로그 수신
      window.electronAPI.onConsoleLog((log) => {
        consoleLogBuffer.push(`[${new Date().toLocaleTimeString()}] ${log}`)
        
        // 최대 로그 수 제한
        if (consoleLogBuffer.length > MAX_CONSOLE_LOGS) {
          consoleLogBuffer.shift()
        }
        
        updateConsoleOutput()
      })

      // 콘솔 출력 업데이트
      function updateConsoleOutput() {
        const consoleOutput = document.getElementById('consoleOutput')
        if (consoleOutput) {
          consoleOutput.textContent = consoleLogBuffer.join('\n')
          consoleOutput.scrollTop = consoleOutput.scrollHeight
        }
      }

      // 콘솔 로그 지우기
      function clearConsoleLog() {
        consoleLogBuffer = []
        updateConsoleOutput()
      }
      // 서비스 설정
      const services = [
        {
          id: 'docker',
          name: 'Docker Desktop',
          icon: '🐳',
          type: 'docker',
          canControl: true,
        },
        {
          id: 'mysql',
          name: 'MySQL Database',
          icon: '🗄️',
          type: 'container',
          port: 3307,
          canControl: false,
        },
        {
          id: 'nginx',
          name: 'Nginx Proxy',
          icon: '🌐',
          type: 'container',
          port: 443,
          canControl: false,
        },
        {
          id: 'api',
          name: 'API Server',
          icon: '⚡',
          type: 'api',
          port: 8000,
          canControl: true,
        },
        {
          id: 'web-admin',
          name: '관리자 앱',
          icon: '🔧',
          type: 'web-admin',
          port: 3000,
          canControl: true,
          url: 'https://app.civilization.zone',
        },
        {
          id: 'web-user',
          name: '사용자 앱',
          icon: '👥',
          type: 'web-user',
          port: 4200,
          canControl: true,
          url: 'https://user.civilization.zone',
        },
      ]

      // 포트 설정
      const ports = [
        { port: 3000, name: '관리자 웹', index: 0 },
        { port: 4200, name: '사용자 웹', index: 1 },
        { port: 8000, name: 'API Server', index: 2 },
        { port: 3307, name: 'MySQL', index: 3 },
        { port: 443, name: 'Nginx', index: 4 },
        { port: 5555, name: 'Prisma Studio', index: 5 },
      ]

      let currentLogService = 'api'

      // 서비스 목록 렌더링
      function renderServices() {
        const servicesList = document.getElementById('servicesList')
        servicesList.innerHTML = services
          .map((service) => {
            const status = getServiceStatus(service.id)
            const statusClass = status.toLowerCase()
            const canControl = service.canControl !== false

            return `
            <div class="service-item">
              <div class="service-header">
                <div class="service-icon">${service.icon}</div>
                <div class="service-info">
                  <div class="service-name">${service.name}</div>
                  <div class="service-port">${service.port ? `포트: ${service.port}` : '시스템 서비스'}</div>
                </div>
                <div class="service-status ${statusClass}">
                  <span class="status-dot"></span>
                  ${status}
                </div>
              </div>
              ${
                canControl
                  ? `
              <div class="service-actions">
                <button class="btn btn-secondary btn-sm" onclick="handleStart('${service.id}')" id="start-${service.id}">시작</button>
                <button class="btn btn-secondary btn-sm" onclick="handleStop('${service.id}')" id="stop-${service.id}">중지</button>
                <button class="btn btn-secondary btn-sm" onclick="handleRestart('${service.id}')" id="restart-${service.id}">재시작</button>
                ${service.url ? `<button class="btn btn-secondary btn-sm" onclick="openUrl('${service.url}')">웹 열기</button>` : ''}
                <button class="btn btn-secondary btn-icon" onclick="handleViewLog('${service.id}')" title="로그 보기">📋</button>
              </div>
              `
                  : ''
              }
            </div>
          `
          })
          .join('')

        updateServiceButtons()
      }

      // 포트 상태 렌더링
      function renderPorts() {
        const portGrid = document.getElementById('portGrid')
        portGrid.innerHTML = ports
          .map((port) => {
            return `
            <div class="port-item">
              <div class="port-info">
                <div class="port-number">${port.port}</div>
                <div class="port-name">${port.name}</div>
              </div>
              <div class="port-status checking" id="port-${port.port}">확인 중...</div>
            </div>
          `
          })
          .join('')
      }

      // 로그 탭 렌더링
      function renderLogTabs() {
        const logTabs = document.getElementById('logTabs')
        const controllableServices = services.filter(
          (s) => s.canControl !== false,
        )
        logTabs.innerHTML = controllableServices
          .map((service) => {
            return `
            <button class="tab ${service.id === currentLogService ? 'active' : ''}" 
                    onclick="switchLogTab('${service.id}')">
              ${service.name}
            </button>
          `
          })
          .join('')
      }

      // 로그 탭 전환
      function switchLogTab(serviceId) {
        currentLogService = serviceId
        renderLogTabs()
        updateLogs()
      }

      // 로그 업데이트
      async function updateLogs() {
        const logOutput = document.getElementById('logOutput')
        let logs = ''

        try {
          if (currentLogService === 'api') {
            logs = await window.electronAPI.getApiLogs()
          } else if (currentLogService === 'web-admin') {
            logs = await window.electronAPI.getWebAdminLogs()
          } else if (currentLogService === 'web-user') {
            logs = await window.electronAPI.getWebUserLogs()
          }
          
          // 로그가 있으면 표시
          if (logs && logs.trim()) {
            logOutput.textContent = logs
            logOutput.scrollTop = logOutput.scrollHeight
          } else {
            logOutput.textContent = `${currentLogService.toUpperCase()} 로그가 없거나 서버가 시작되지 않았습니다.`
          }
        } catch (error) {
          console.error('로그 불러오기 실패:', error)
          logOutput.textContent = `로그를 불러올 수 없습니다: ${error.message}`
        }
      }

      // URL 열기
      function openUrl(url) {
        window.electronAPI.openExternal(url)
      }

      // 서비스 상태 가져오기
      function getServiceStatus(serviceId) {
        // 여기서 실제 상태를 가져와야 함
        // 임시로 'stopped' 반환
        if (!window.cachedStatus) return 'stopped'
        
        const status = window.cachedStatus
        
        switch (serviceId) {
          case 'docker':
            return status.docker?.isRunning ? 'running' : 'stopped'
          case 'mysql':
            return status.docker?.containers?.mysql ? 'running' : 'stopped'
          case 'nginx':
            return status.docker?.containers?.nginx ? 'running' : 'stopped'
          case 'api':
            return status.evolutionServer?.apiServer?.isRunning ? 'running' : 'stopped'
          case 'web-admin':
            return status.evolutionServer?.webAdminServer?.isRunning ? 'running' : 'stopped'
          case 'web-user':
            return status.evolutionServer?.webUserServer?.isRunning ? 'running' : 'stopped'
          default:
            return 'stopped'
        }
      }

      // 서비스 컨트롤
      async function handleStart(serviceId) {
        console.log('Starting:', serviceId)
        const statusText = document.getElementById('statusText')
        statusText.textContent = `${serviceId} 시작 중...`
        
        try {
          if (serviceId === 'docker') {
            await window.electronAPI.startDocker()
          } else if (serviceId === 'api') {
            await window.electronAPI.startApi()
          } else if (serviceId === 'web-admin') {
            await window.electronAPI.startWebAdmin()
          } else if (serviceId === 'web-user') {
            await window.electronAPI.startWebUser()
          }
          console.log(`${serviceId} 시작 명령 전송 완료`)
          setTimeout(updateStatus, 2000)
        } catch (error) {
          console.error(`${serviceId} 시작 실패:`, error)
          statusText.textContent = `${serviceId} 시작 실패`
        }
      }

      async function handleStop(serviceId) {
        console.log('Stopping:', serviceId)
        const statusText = document.getElementById('statusText')
        statusText.textContent = `${serviceId} 중지 중...`
        
        try {
          if (serviceId === 'docker') {
            await window.electronAPI.stopDocker()
          } else if (serviceId === 'api') {
            await window.electronAPI.stopApi()
          } else if (serviceId === 'web-admin') {
            await window.electronAPI.stopWebAdmin()
          } else if (serviceId === 'web-user') {
            await window.electronAPI.stopWebUser()
          }
          console.log(`${serviceId} 중지 명령 전송 완료`)
          setTimeout(updateStatus, 2000)
        } catch (error) {
          console.error(`${serviceId} 중지 실패:`, error)
          statusText.textContent = `${serviceId} 중지 실패`
        }
      }

      async function handleRestart(serviceId) {
        await handleStop(serviceId)
        setTimeout(() => handleStart(serviceId), 1000)
      }

      async function handleViewLog(serviceId) {
        currentLogService = serviceId
        renderLogTabs()
        await updateLogs()
      }

      // 버튼 상태 업데이트
      function updateServiceButtons() {
        services.forEach((service) => {
          if (service.canControl === false) return

          const status = getServiceStatus(service.id)
          const startBtn = document.getElementById(`start-${service.id}`)
          const stopBtn = document.getElementById(`stop-${service.id}`)
          const restartBtn = document.getElementById(`restart-${service.id}`)

          if (startBtn && stopBtn && restartBtn) {
            if (status === 'running') {
              startBtn.disabled = true
              stopBtn.disabled = false
              restartBtn.disabled = false
            } else {
              startBtn.disabled = false
              stopBtn.disabled = true
              restartBtn.disabled = true
            }
          }
        })
      }

      // 전역 상태 업데이트
      async function updateStatus() {
        try {
          const status = await window.electronAPI.getStatus()
          window.cachedStatus = status // 캐시에 저장
          
          const globalStatus = document.getElementById('globalStatus')
          const statusText = document.getElementById('statusText')
          const startAllBtn = document.getElementById('startAllBtn')
          const stopAllBtn = document.getElementById('stopAllBtn')

          if (status.allReady) {
            globalStatus.classList.remove('loading')
            statusText.textContent = '모든 서비스 실행 중'
            startAllBtn.disabled = true
            stopAllBtn.disabled = false
          } else {
            globalStatus.classList.add('loading')
            statusText.textContent = '일부 서비스 중지됨'
            startAllBtn.disabled = false
            stopAllBtn.disabled = true
          }

          renderServices()
          await updatePortStatus()
          await updateLogs()
        } catch (error) {
          console.error('Status update failed:', error)
          const statusText = document.getElementById('statusText')
          statusText.textContent = '상태 업데이트 실패'
        }
      }

      // 포트 상태 업데이트
      async function updatePortStatus() {
        for (const port of ports) {
          try {
            const isOpen = await window.electronAPI.checkPort(port.port)
            const statusEl = document.getElementById(`port-${port.port}`)
            if (statusEl) {
              statusEl.textContent = isOpen ? '열림' : '닫힘'
              statusEl.className = `port-status ${isOpen ? 'open' : 'closed'}`
            }
          } catch (error) {
            console.error(`Port ${port.port} check failed:`, error)
          }
        }
      }

      // 전체 시작/중지
      document.getElementById('startAllBtn').onclick = async () => {
        await window.electronAPI.startAll()
        setTimeout(updateStatus, 1000)
      }

      document.getElementById('stopAllBtn').onclick = async () => {
        await window.electronAPI.stopAll()
        setTimeout(updateStatus, 1000)
      }

      // 초기화
      window.cachedStatus = null
      renderServices()
      renderPorts()
      renderLogTabs()
      
      // 초기 상태 로드
      updateStatus()

      // 주기적 업데이트
      setInterval(updateStatus, 3000)
      setInterval(updateLogs, 2000)
    </script>
  </body>
</html>
