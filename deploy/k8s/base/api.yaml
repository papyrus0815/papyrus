# Papyrus API (NestJS)
#
# 레플리카를 1로 둔 이유 — 코드가 아직 '여러 대'를 전제하지 않는다(deploy/README.md 「수평 확장 전에」):
#   1. 로그인 시도 제한이 프로세스 메모리(login-attempt-limiter.ts)
#   2. @Cron 두 개(이벤트 휴지통·알림 정리)가 레플리카 수만큼 중복 실행
#   3. 업로드가 로컬 디스크(multer diskStorage) — 파드마다 디스크가 다르다
apiVersion: v1
kind: ConfigMap
metadata:
  name: papyrus-api-config
data:
  NODE_ENV: production
  BIND_HOST: 0.0.0.0
  PORT: "8000"
  API_PORT: "8000"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  # 브라우저가 여는 주소. 같은 오리진(web nginx가 /api를 프록시)이라 CORS는 실제로 타지 않지만 명시해 둔다
  APP_ORIGINS: http://localhost:8088
  COOKIE_SAMESITE: lax
  # 요청 경로: 클라이언트 → Traefik 파드 → web 파드(nginx) → API. 둘 다 사설 대역(10.42.0.0/16)
  TRUST_PROXY: loopback, uniquelocal
  UPLOAD_PATH: ./apps/api/uploads
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  NODE_OPTIONS: --max-old-space-size=384
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: papyrus-api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # 새 파드가 ready가 된 뒤에 옛 파드를 내린다
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node 이미지의 node 사용자 (숫자여야 kubelet이 비root를 검증할 수 있다)
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM → main.ts의 graceful shutdown(최대 5초) + preStop 5초
      terminationGracePeriodSeconds: 30
      initContainers:
        # 스키마를 먼저 맞추고 나서 앱을 띄운다. 새 버전이 뜰 때마다 자동으로 돈다.
        # Prisma가 advisory lock을 잡으므로 레플리카가 늘어나 동시에 돌아도 한 번만 적용된다.
        # MySQL 미기동·빈 DB(스냅샷 복원 전)면 기다린다 — 이미지의 migrate.sh 참고
        - name: migrate
          image: papyrus/migrate
          env:
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_PASSWORD } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_DATABASE } }
            # Prisma CLI·Joi 검증은 URL을, PrismaService(어댑터)는 MYSQL_* 5개를 읽는다 — 둘 다 필요
            - name: DATABASE_URL
              value: mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/$(MYSQL_DATABASE)
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: npm-cache
              mountPath: /home/node/.npm
      containers:
        - name: api
          image: papyrus/api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: papyrus-api-config
          env:
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_PASSWORD } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: MYSQL_DATABASE } }
            - name: DATABASE_URL
              value: mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mysql:3306/$(MYSQL_DATABASE)
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: papyrus-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 640Mi }
          securityContext: *containerSecurity
          # 기동이 느리다(NestFactory를 설정 읽기용·본용으로 두 번 만든다) → startupProbe가 끝날 때까지
          # liveness가 개입하지 않게
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          # 프로세스만 본다. DB 장애로 재시작시키면 장애가 커질 뿐이다
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          # DB까지 본다(SELECT 1). 실패하면 503 → Service 엔드포인트에서 빠진다
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # 엔드포인트 제거가 kube-proxy·Traefik에 퍼질 시간을 벌고 나서 SIGTERM
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: uploads
              mountPath: /app/apps/api/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: api-uploads
        - name: tmp
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
