# web-admin 정적 번들 + nginx. 상태가 없어 레플리카를 자유롭게 늘릴 수 있다.
apiVersion: v1
kind: Service
metadata:
  name: papyrus-web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged 이미지의 nginx 사용자
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # 두 레플리카가 같은 노드에 몰리지 않게(노드 하나가 죽어도 화면은 산다)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        - name: web
          image: papyrus/web
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx 템플릿의 ${API_UPSTREAM} — Service DNS
            - name: API_UPSTREAM
              value: papyrus-api:8000
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            # 읽기 전용 루트에서 nginx가 쓰는 곳: 템플릿 렌더 결과·pid·캐시
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
