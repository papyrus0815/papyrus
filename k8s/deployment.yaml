apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-api-deployment
  labels:
    app: papyrus-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: papyrus-api
  template:
    metadata:
      labels:
        app: papyrus-api
    spec:
      containers:
        - name: api
          image: registry.gitlab.com/your-group/papyrus/api:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: papyrus-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: papyrus-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: papyrus-api-service
  labels:
    app: papyrus-api
spec:
  selector:
    app: papyrus-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
---
# Secrets는 별도로 관리해야 합니다
# kubectl create secret generic papyrus-secrets \
#   --from-literal=database-url='mysql://user:pass@host:3306/papyrus' \
#   --from-literal=jwt-secret='your-production-jwt-secret'
